<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Refreshing TradingBible…</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07070a;
        color: #e9e7df;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { width: min(28rem, 100%); text-align: center; }
      .mark {
        width: 42px; height: 42px; margin: 0 auto 18px; border-radius: 11px;
        display: grid; place-items: center; border: 1px solid rgba(212,175,55,.35);
        background: rgba(212,175,55,.12); color: #e8c95a; font-weight: 800;
      }
      h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
      p { margin: 8px 0 0; color: #8a8577; font-size: 13px; line-height: 1.6; }
      a { color: #e8c95a; text-underline-offset: 3px; }
      .spinner {
        width: 18px; height: 18px; margin: 20px auto 0; border-radius: 50%;
        border: 2px solid rgba(212,175,55,.2); border-top-color: #d4af37;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">TB</div>
      <h1>Refreshing TradingBible</h1>
      <p id="status">Clearing the old cached app shell…</p>
      <div class="spinner" aria-hidden="true"></div>
      <p><a href="/terminal">Open the terminal manually</a></p>
    </main>
    <script>
      (async function resetTradingBible() {
        const status = document.getElementById('status');
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }
          if (window.caches && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }
          status.textContent = 'Loading the fresh terminal…';
        } catch (error) {
          status.textContent = 'Reloading the terminal…';
        }
        const target = new URL('/terminal', window.location.origin);
        target.searchParams.set('fresh', Date.now().toString(36));
        window.location.replace(target.toString());
      })();
    </script>
  </body>
</html>
