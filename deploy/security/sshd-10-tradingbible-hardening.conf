# TradingBible — immediate SSH hardening.
# Install at /etc/ssh/sshd_config.d/10-tradingbible-hardening.conf.
#
# This file must sort BEFORE the cloud-init drop-ins because OpenSSH uses the
# first value it reads for each keyword. The cloud image ships
# 50-cloud-init.conf with "PasswordAuthentication yes"; a 99-* file would be
# too late to override it.
#
# Root login remains key-only until a named sudo account has been created,
# tested and recorded. Do not set "PermitRootLogin no" while root is the only
# administrative account.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
