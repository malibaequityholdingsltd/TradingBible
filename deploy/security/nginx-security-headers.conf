# TradingBible public edge security headers.
# Include this file inside every Nginx location that serves HTML or static
# assets. The API is intentionally excluded: Express Helmet owns API headers,
# so the edge does not emit duplicate HSTS/frame/content-type values.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com https://*.paddle.com https://www.paypal.com; img-src 'self' data: blob: https:; font-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.paddle.com https://www.paypal.com https://www.google.com https://www.gstatic.com https://challenges.cloudflare.com https://cdn.jsdelivr.net; script-src-attr 'none'; connect-src 'self' https: wss:; media-src 'self' blob: https:; frame-src 'self' https://js.stripe.com https://*.paddle.com https://www.paypal.com https://www.youtube.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
