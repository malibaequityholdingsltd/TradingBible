# TradingBible — SSH hardening for private administration.
# Install at /etc/ssh/sshd_config.d/99-tradingbible.conf only after
# private access has been proven. Validate with `sshd -t` before reload.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
