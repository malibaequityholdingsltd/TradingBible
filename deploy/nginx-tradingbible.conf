# /etc/nginx/sites-available/tradingbible.app
# Symlink: ln -s /etc/nginx/sites-available/tradingbible.app /etc/nginx/sites-enabled/
# Simplified: NO local PocketBase. Database is cloud-hosted; only the API
# server (port 3001) and the static SPA are served from this VPS.
#
# Install deploy/security/nginx-security-headers.conf at
# /etc/nginx/snippets/tradingbible-security-headers.conf before using this file.
# The API proxy intentionally does not include that snippet: Express Helmet owns
# API headers, and the edge must not emit duplicate HSTS/frame/content-type values.

server {
    listen 80;
    listen [::]:80;
    server_name tradingbible.app www.tradingbible.app;
    server_tokens off;
    root /var/www/tradingbible/dist/apps/web;

    # Let us Encrypt HTTP-01 renewal must bypass the HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tradingbible.app www.tradingbible.app;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/tradingbible.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradingbible.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    server_tokens       off;

    root /var/www/tradingbible/dist/apps/web;
    index index.html;

    # ── Static web app (SPA) ──────────────────────────────────────
    location / {
        include /etc/nginx/snippets/tradingbible-security-headers.conf;
        try_files $uri $uri/ /index.html;
        gzip_static on;
        expires -1;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|webp|ico)$ {
        include /etc/nginx/snippets/tradingbible-security-headers.conf;
        expires 1y;
    }

    # Never cache the service worker — it must always revalidate so
    # updates (cache version bumps) reach clients promptly.
    location = /sw.js {
        include /etc/nginx/snippets/tradingbible-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Express API (/api/ → localhost:3001) ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Legacy path used by the built frontend client
    # SI streaming: flush SSE immediately and keep the connection open long
    # enough for provider fallback plus token generation. Buffering is off so
    # headers and keep-alive comments reach the browser without delay.
    location /hcgi/api/integrated-ai/ {
        proxy_pass         http://127.0.0.1:3001/integrated-ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
        gzip off;
    }

    location /hcgi/api/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
