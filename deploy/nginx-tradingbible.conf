# /etc/nginx/sites-available/tradingbible.app
# Symlink: ln -s /etc/nginx/sites-available/tradingbible.app /etc/nginx/sites-enabled/
# Simplified: NO local PocketBase. Database is cloud-hosted; only the API
# server (port 3001) and the static SPA are served from this VPS.

server {
    listen 80;
    listen [::]:80;
    server_name tradingbible.app www.tradingbible.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradingbible.app www.tradingbible.app;

    ssl_certificate     /etc/ssl/certs/tradingbible.crt;
    ssl_certificate_key /etc/ssl/private/tradingbible.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens       off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/tradingbible/dist/apps/web;
    index index.html;

    # ── Static web app (SPA) ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        gzip_static on;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker — it must always revalidate so
    # updates (cache version bumps) reach clients promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ── Express API (/api/ → localhost:3001) ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Legacy path used by the built frontend client
    location /hcgi/api/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
